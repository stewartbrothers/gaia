# golangci-lint configuration for gaia.
# Tested against v2.x. Update Go and lint versions together; the
# CI workflow's `go install` line and this file's enabled linters
# must stay in sync — bumping one without the other surfaces as a
# CI failure on the next push.
version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    gocritic:
      disabled-checks:
        - ifElseChain
    staticcheck:
      # The QF (quickfix) family is new in v2 and consists of
      # stylistic refactor suggestions; ST1000/ST1021 are
      # comment-style nags that v2 surfaces by default and v1
      # silenced. Skipping all four to keep parity with the v1
      # ruleset until we choose to opt in deliberately.
      checks:
        - "all"
        - "-QF1001"
        - "-QF1002"
        - "-QF1011"
        - "-ST1000"
        - "-ST1021"
    revive:
      severity: warning
      rules:
        - name: var-naming
        - name: unexported-return
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: receiver-naming
        - name: indent-error-flow
        - name: increment-decrement
        - name: range
        - name: superfluous-else
        - name: time-naming
        - name: unreachable-code
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/stewartbrothers/gaia
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
