description: |
  `gaia wiki list --format pretty` exercises prettyWikiList.

mocks:
  - method: GET
    path: /repos/o/r/wiki/pages
    status: 200
    body: |
      [
        {
          "title": "Home",
          "sub_url": "Home",
          "html_url": "https://example/wiki/Home",
          "last_commit": {
            "sha": "abc1234deadbeef",
            "commiter": {"name": "alice", "email": "a@x", "date": "2026-04-01T00:00:00Z"},
            "author":   {"date": "2026-04-01T00:00:00Z"},
            "message":  "init"
          }
        }
      ]

stages:
  - args:
      - --provider
      - forgejo
      - --api-url
      - ${apiURL}
      - --repo
      - o/r
      - --format
      - pretty
      - wiki
      - list
    env:
      FORGEJO_TOKEN: TEST
    exit_code: 0
