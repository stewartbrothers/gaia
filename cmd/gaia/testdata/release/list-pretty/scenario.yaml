description: |
  `gaia release list --format pretty` exercises prettyReleaseList.

mocks:
  - method: GET
    path: /repos/o/r/releases
    status: 200
    body: |
      [
        {
          "id": 9,
          "tag_name": "v0.2.0",
          "name": "v0.2.0",
          "body": "fixes",
          "draft": false,
          "prerelease": false,
          "author": {"login": "alice"},
          "target_commitish": "main",
          "created_at": "2026-04-10T00:00:00Z",
          "published_at": "2026-04-10T00:00:00Z"
        }
      ]

stages:
  - args:
      - --provider
      - forgejo
      - --api-url
      - ${apiURL}
      - --repo
      - o/r
      - --format
      - pretty
      - release
      - list
    env:
      FORGEJO_TOKEN: TEST
    exit_code: 0
