description: |
  `gaia release view --format value --fields tag_name` outputs the bare
  scalar value with no JSON envelope. Used by scripts and chains that
  need to capture a single field without piping through jq.

mocks:
  - method: GET
    path: /repos/o/r/releases/tags/v0.2.0
    status: 200
    body: |
      {
        "id": 9,
        "tag_name": "v0.2.0",
        "name": "Release name",
        "body": "notes",
        "draft": false,
        "prerelease": false,
        "author": {"login": "alice"},
        "target_commitish": "main",
        "created_at": "2026-04-10T00:00:00Z",
        "published_at": "2026-04-10T00:00:00Z"
      }

stages:
  - args:
      - --provider
      - forgejo
      - --api-url
      - ${apiURL}
      - --repo
      - o/r
      - --format
      - value
      - --fields
      - tag_name
      - release
      - view
      - v0.2.0
    env:
      FORGEJO_TOKEN: TEST
    exit_code: 0
