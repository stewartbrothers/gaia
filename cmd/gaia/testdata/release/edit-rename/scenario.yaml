description: |
  `gaia release edit v0.2.0 --rename --name` is a two-step:
  GET /releases/tags/v0.2.0 (resolve ID), PATCH /releases/{id}.

mocks:
  - method: GET
    path: /repos/o/r/releases/tags/v0.2.0
    status: 200
    body: |
      {
        "id": 9,
        "tag_name": "v0.2.0",
        "name": "old name",
        "body": "old body",
        "draft": false,
        "prerelease": false,
        "author": {"login": "alice"},
        "target_commitish": "main",
        "created_at": "2026-04-10T00:00:00Z",
        "published_at": "2026-04-10T00:00:00Z"
      }
  - method: PATCH
    path: /repos/o/r/releases/9
    status: 200
    body: |
      {
        "id": 9,
        "tag_name": "v0.2.1",
        "name": "renamed",
        "body": "old body",
        "draft": false,
        "prerelease": false,
        "author": {"login": "alice"},
        "target_commitish": "main",
        "created_at": "2026-04-10T00:00:00Z",
        "published_at": "2026-04-10T00:00:00Z"
      }

stages:
  - args:
      - --provider
      - forgejo
      - --api-url
      - ${apiURL}
      - --repo
      - o/r
      - release
      - edit
      - v0.2.0
      - --rename
      - v0.2.1
      - --name
      - renamed
    env:
      FORGEJO_TOKEN: TEST
    exit_code: 0
    assert_request:
      method: PATCH
      path: /repos/o/r/releases/9
      body_contains: '"tag_name":"v0.2.1"'
