description: |
  `gaia release publish` replaces existing assets rather than creating
  duplicates. Scenario has an existing release (200 on GET) with one
  asset already uploaded (gaia-linux-amd64.tar.gz). The darwin asset
  is new and is uploaded directly. The linux asset already exists and
  must be deleted first then re-uploaded — the output should report
  "replaced":true for it.

mocks:
  - method: GET
    path: /repos/o/r/releases/tags/v1.0.0
    status: 200
    body: |
      {
        "id": 50,
        "tag_name": "v1.0.0",
        "name": "v1.0.0",
        "body": "release notes",
        "draft": false,
        "prerelease": false,
        "author": {"login": "alice"},
        "target_commitish": "main",
        "created_at": "2026-04-20T00:00:00Z",
        "published_at": "2026-04-20T00:00:00Z"
      }
  - method: GET
    path: /repos/o/r/releases/50/assets
    status: 200
    body: |
      [{"id": 1, "name": "gaia-linux-amd64.tar.gz", "size": 100}]
  - method: DELETE
    path: /repos/o/r/releases/50/assets/1
    status: 204
    body: ""
  - method: POST
    path: /repos/o/r/releases/50/assets
    status: 201
    body: |
      {"id": 3, "name": "gaia-linux-amd64.tar.gz"}

stages:
  - args:
      - --provider
      - forgejo
      - --api-url
      - ${apiURL}
      - --repo
      - o/r
      - release
      - publish
      - v1.0.0
      - --asset
      - ${scenarioDir}/assets/gaia-darwin-amd64.tar.gz
      - --asset
      - ${scenarioDir}/assets/gaia-linux-amd64.tar.gz
    env:
      FORGEJO_TOKEN: TEST
    exit_code: 0
