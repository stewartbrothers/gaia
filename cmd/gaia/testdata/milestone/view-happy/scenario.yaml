description: |
  `gaia milestone view 7` GETs /milestones/7.

mocks:
  - method: GET
    path: /repos/o/r/milestones/7
    status: 200
    body: |
      {
        "id": 7,
        "title": "v0.4.0",
        "description": "shipped features",
        "state": "open",
        "open_issues": 5,
        "closed_issues": 3,
        "created_at": "2026-04-01T00:00:00Z",
        "updated_at": "2026-04-15T00:00:00Z",
        "due_on": "2026-05-01T00:00:00Z"
      }

stages:
  - args:
      - --provider
      - forgejo
      - --api-url
      - ${apiURL}
      - --repo
      - o/r
      - milestone
      - view
      - "7"
    env:
      FORGEJO_TOKEN: TEST
    exit_code: 0
    assert_request:
      method: GET
      path: /repos/o/r/milestones/7
