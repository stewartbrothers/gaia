description: |
  `gaia pr reopen 42` PATCHes state=open.

mocks:
  - method: PATCH
    path: /repos/o/r/pulls/42
    status: 200
    body: |
      {
        "number": 42, "title": "ship", "state": "open",
        "user": {"login": "alice"},
        "head": {"ref": "feature/x", "sha": "deadbeef", "repo": {"full_name": "o/r"}},
        "base": {"ref": "main",      "sha": "cafebabe", "repo": {"full_name": "o/r"}},
        "merged": false,
        "created_at": "2026-04-01T00:00:00Z",
        "updated_at": "2026-04-06T00:00:00Z"
      }

stages:
  - args:
      - --provider
      - forgejo
      - --api-url
      - ${apiURL}
      - --repo
      - o/r
      - pr
      - reopen
      - "42"
    env:
      FORGEJO_TOKEN: TEST
    exit_code: 0
    assert_request:
      method: PATCH
      path: /repos/o/r/pulls/42
      body_contains: '"state":"open"'
