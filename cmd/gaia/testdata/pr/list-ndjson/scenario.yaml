description: |
  `gaia pr list --format ndjson` happy path. Two PRs, each emits as
  one {"item": ...} line, then a {"_metadata": ...} trailer.

mocks:
  - method: GET
    path: /repos/o/r/pulls
    status: 200
    body: |
      [
        {
          "number": 7, "title": "first feature", "state": "open",
          "user": {"login": "alice"},
          "head": {"ref": "feature/x", "sha": "deadbeef", "repo": {"full_name": "o/r"}},
          "base": {"ref": "main",      "sha": "cafebabe", "repo": {"full_name": "o/r"}},
          "merged": false,
          "created_at": "2026-04-01T00:00:00Z",
          "updated_at": "2026-04-02T00:00:00Z"
        },
        {
          "number": 8, "title": "second", "state": "closed",
          "user": {"login": "bob"},
          "head": {"ref": "feature/y", "sha": "11111111", "repo": {"full_name": "o/r"}},
          "base": {"ref": "main",      "sha": "22222222", "repo": {"full_name": "o/r"}},
          "merged": true,
          "created_at": "2026-04-03T00:00:00Z",
          "updated_at": "2026-04-04T00:00:00Z",
          "merged_at": "2026-04-04T00:00:00Z"
        }
      ]

stages:
  - args:
      - --provider
      - forgejo
      - --api-url
      - ${apiURL}
      - --repo
      - o/r
      - --format
      - ndjson
      - pr
      - list
    env:
      FORGEJO_TOKEN: TEST
    exit_code: 0
