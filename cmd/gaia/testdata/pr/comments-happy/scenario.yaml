description: |
  `gaia pr comments 42` fans out to 3 endpoints (issue, review, inline)
  and merges them into a time-ordered Source-tagged stream.

mocks:
  - method: GET
    path: /repos/o/r/issues/42/comments
    status: 200
    body: |
      [
        {
          "id": 1,
          "user": {"login": "alice"},
          "body": "thread comment",
          "created_at": "2026-04-01T00:00:00Z",
          "updated_at": "2026-04-01T00:00:00Z"
        }
      ]
  - method: GET
    path: /repos/o/r/pulls/42/reviews
    status: 200
    body: |
      [
        {
          "id": 50,
          "user": {"login": "bob"},
          "body": "review-level remark",
          "state": "COMMENT",
          "submitted_at": "2026-04-02T00:00:00Z"
        }
      ]
  - method: GET
    path: /repos/o/r/pulls/42/comments
    status: 200
    body: |
      [
        {
          "id": 100,
          "user": {"login": "carol"},
          "body": "inline note",
          "path": "src/main.go",
          "position": 12,
          "line": 42,
          "created_at": "2026-04-03T00:00:00Z",
          "updated_at": "2026-04-03T00:00:00Z"
        }
      ]

stages:
  - args:
      - --provider
      - forgejo
      - --api-url
      - ${apiURL}
      - --repo
      - o/r
      - pr
      - comments
      - "42"
    env:
      FORGEJO_TOKEN: TEST
    exit_code: 0
