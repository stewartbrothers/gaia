description: |
  `gaia actions list` returns recent workflow runs newest first.

mocks:
  - method: GET
    path: /repos/o/r/actions/runs
    status: 200
    body: |
      {
        "total_count": 2,
        "workflow_runs": [
          {
            "id": 42,
            "name": "CI",
            "event": "push",
            "status": "completed",
            "conclusion": "success",
            "head_branch": "main",
            "head_sha": "abc1234",
            "head_commit": {"message": "fix: something important"},
            "trigger_actor": {"login": "alice"},
            "created_at": "2026-04-10T10:00:00Z",
            "updated_at": "2026-04-10T10:05:00Z"
          },
          {
            "id": 41,
            "name": "CI",
            "event": "push",
            "status": "completed",
            "conclusion": "failure",
            "head_branch": "feature/x",
            "head_sha": "dead0000",
            "head_commit": {"message": "wip"},
            "trigger_actor": {"login": "bob"},
            "created_at": "2026-04-10T09:00:00Z",
            "updated_at": "2026-04-10T09:10:00Z"
          }
        ]
      }

stages:
  - args:
      - --provider
      - forgejo
      - --api-url
      - ${apiURL}
      - --repo
      - o/r
      - actions
      - list
    env:
      FORGEJO_TOKEN: TEST
    exit_code: 0
