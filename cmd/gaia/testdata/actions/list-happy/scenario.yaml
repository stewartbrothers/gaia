description: |
  `gaia actions list` returns recent workflow runs newest first.

  The mock body uses Forgejo's real ActionRun JSON shape (verified
  against Forgejo v15.0.1's swagger + source): `index_in_repo` is the
  user-facing run number that surfaces as ID, `id` is the internal db
  ID that surfaces as RunID, `prettyref` is the branch, `commit_sha`
  is the head SHA, `title` is the head message, `trigger_user.login`
  is the actor, `created`/`updated` (no `_at` suffix) are timestamps.

mocks:
  - method: GET
    path: /repos/o/r/actions/runs
    status: 200
    body: |
      {
        "total_count": 2,
        "workflow_runs": [
          {
            "id": 1706,
            "index_in_repo": 362,
            "title": "fix: something important",
            "workflow_id": "ci.yml",
            "event": "push",
            "status": "success",
            "prettyref": "main",
            "commit_sha": "abc1234",
            "trigger_user": {"login": "alice"},
            "created": "2026-04-10T10:00:00Z",
            "updated": "2026-04-10T10:05:00Z",
            "html_url": "https://example.test/o/r/actions/runs/362"
          },
          {
            "id": 1705,
            "index_in_repo": 361,
            "title": "wip",
            "workflow_id": "ci.yml",
            "event": "push",
            "status": "failure",
            "prettyref": "feature/x",
            "commit_sha": "dead0000",
            "trigger_user": {"login": "bob"},
            "created": "2026-04-10T09:00:00Z",
            "updated": "2026-04-10T09:10:00Z",
            "html_url": "https://example.test/o/r/actions/runs/361"
          }
        ]
      }

stages:
  - args:
      - --provider
      - forgejo
      - --api-url
      - ${apiURL}
      - --repo
      - o/r
      - actions
      - list
    env:
      FORGEJO_TOKEN: TEST
    exit_code: 0
