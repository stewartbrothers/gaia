description: |
  `gaia actions view <run-id>` returns the run summary without jobs by default.

mocks:
  - method: GET
    path: /repos/o/r/actions/runs/42
    status: 200
    body: |
      {
        "id": 42,
        "name": "CI",
        "event": "push",
        "status": "completed",
        "conclusion": "success",
        "head_branch": "main",
        "head_sha": "abc1234",
        "head_commit": {"message": "fix: something important"},
        "trigger_actor": {"login": "alice"},
        "created_at": "2026-04-10T10:00:00Z",
        "updated_at": "2026-04-10T10:05:00Z"
      }

stages:
  - args:
      - --provider
      - forgejo
      - --api-url
      - ${apiURL}
      - --repo
      - o/r
      - actions
      - view
      - "42"
    env:
      FORGEJO_TOKEN: TEST
    exit_code: 0
