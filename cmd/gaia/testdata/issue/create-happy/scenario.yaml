description: |
  `gaia issue create --title --body --label --assignee` posts to
  /repos/o/r/issues and renders the freshly-created issue.

mocks:
  - method: POST
    path: /repos/o/r/issues
    status: 201
    body: |
      {
        "number": 7, "title": "new bug", "state": "open",
        "user": {"login": "alice"},
        "labels": [{"id": 1, "name": "bug", "color": "ff0000"}],
        "body": "repro: …",
        "created_at": "2026-04-01T00:00:00Z",
        "updated_at": "2026-04-01T00:00:00Z"
      }

stages:
  - args:
      - --provider
      - forgejo
      - --api-url
      - ${apiURL}
      - --repo
      - o/r
      - issue
      - create
      - --title
      - "new bug"
      - --body
      - "repro: …"
      - --label
      - bug
      - --assignee
      - alice
    env:
      FORGEJO_TOKEN: TEST
    exit_code: 0
    assert_request:
      method: POST
      path: /repos/o/r/issues
      body_contains: '"title":"new bug"'
