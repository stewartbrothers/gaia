description: |
  `gaia issue comment-edit 11 --body` PATCHes a comment by ID.

mocks:
  - method: PATCH
    path: /repos/o/r/issues/comments/11
    status: 200
    body: |
      {
        "id": 11,
        "user": {"login": "alice"},
        "body": "updated text",
        "created_at": "2026-04-05T00:00:00Z",
        "updated_at": "2026-04-06T00:00:00Z"
      }

stages:
  - args:
      - --provider
      - forgejo
      - --api-url
      - ${apiURL}
      - --repo
      - o/r
      - issue
      - comment-edit
      - "11"
      - --body
      - "updated text"
    env:
      FORGEJO_TOKEN: TEST
    exit_code: 0
    assert_request:
      method: PATCH
      path: /repos/o/r/issues/comments/11
      body_contains: '"body":"updated text"'
