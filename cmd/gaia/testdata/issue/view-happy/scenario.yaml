description: |
  `gaia issue view 42` happy path. Single GET with no comments fetch.

mocks:
  - method: GET
    path: /repos/o/r/issues/42
    status: 200
    body: |
      {
        "number": 42, "title": "answer", "state": "open",
        "user": {"login": "alice"},
        "labels": [{"id": 1, "name": "p1", "color": "ff0000"}],
        "body": "what's the answer?",
        "created_at": "2026-04-01T00:00:00Z",
        "updated_at": "2026-04-02T00:00:00Z"
      }

stages:
  - description: gaia issue view 42
    args:
      - --provider
      - forgejo
      - --api-url
      - ${apiURL}
      - --repo
      - o/r
      - issue
      - view
      - "42"
    env:
      FORGEJO_TOKEN: TEST
    exit_code: 0
    assert_request:
      method: GET
      path: /repos/o/r/issues/42
