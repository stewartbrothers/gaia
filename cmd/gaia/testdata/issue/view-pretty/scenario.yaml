description: |
  `gaia issue view 42 --format pretty` exercises prettyIssueView,
  including the label and body lines.

mocks:
  - method: GET
    path: /repos/o/r/issues/42
    status: 200
    body: |
      {
        "number": 42, "title": "answer", "state": "open",
        "user": {"login": "alice"},
        "labels": [{"id": 1, "name": "p1"}, {"id": 2, "name": "feature"}],
        "body": "what is the answer?",
        "created_at": "2026-04-01T00:00:00Z",
        "updated_at": "2026-04-02T00:00:00Z"
      }

stages:
  - args:
      - --provider
      - forgejo
      - --api-url
      - ${apiURL}
      - --repo
      - o/r
      - --format
      - pretty
      - issue
      - view
      - "42"
    env:
      FORGEJO_TOKEN: TEST
    exit_code: 0
