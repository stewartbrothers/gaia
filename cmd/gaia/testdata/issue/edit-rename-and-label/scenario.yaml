description: |
  `gaia issue edit 42 --title --state` PATCHes /repos/o/r/issues/42
  with the new title + state. Pins write-path body shape.

mocks:
  - method: PATCH
    path: /repos/o/r/issues/42
    status: 200
    body: |
      {
        "number": 42, "title": "renamed", "state": "open",
        "user": {"login": "alice"},
        "labels": [{"id": 1, "name": "bug", "color": "ff0000"}],
        "created_at": "2026-04-01T00:00:00Z",
        "updated_at": "2026-04-05T00:00:00Z"
      }

stages:
  - args:
      - --provider
      - forgejo
      - --api-url
      - ${apiURL}
      - --repo
      - o/r
      - issue
      - edit
      - "42"
      - --title
      - renamed
      - --assignee
      - alice
    env:
      FORGEJO_TOKEN: TEST
    exit_code: 0
    assert_request:
      method: PATCH
      path: /repos/o/r/issues/42
      body_contains: '"title":"renamed"'
