description: |
  `gaia packages view --format pretty` exercises prettyPackageView.

mocks:
  - method: GET
    path: /packages/Gerwood/generic/myapp/1.2.0
    status: 200
    body: |
      {
        "type": "generic",
        "name": "myapp",
        "version": "1.2.0",
        "owner": {"login": "Gerwood"},
        "created_at": "2026-04-01T00:00:00Z",
        "size": 1024
      }

stages:
  - args:
      - --provider
      - forgejo
      - --api-url
      - ${apiURL}
      - --repo
      - Gerwood/gaia
      - --format
      - pretty
      - packages
      - view
      - --owner
      - Gerwood
      - generic/myapp/1.2.0
    env:
      FORGEJO_TOKEN: TEST
    exit_code: 0
