# Mirror of .forgejo/workflows/ci.yml for the eventual GitHub mirror (#47).
# Keep these two files in lock-step — the GitHub mirror is a publishing
# target, not a separate test surface.
#
# CI actions are pinned by commit SHA (not floating tag) so a
# compromised actions/* org can't push a malicious update under a
# tag we already trust. Bump the SHA and the trailing version
# comment together when updating. (#140 part 2.)

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          # Pinned to match the floor in go.mod. code.gitea.io/sdk/gitea
          # v0.24.1 requires go1.26; bumped floor to match. Bump go.mod
          # and this file together.
          go-version: '1.26'
          cache: true

      - name: gofmt check
        run: |
          set -e
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite the following files — run \`make fmt\`:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: go vet
        run: make vet

      # The Forgejo runner mirrors the actions/* namespace from
      # code.forgejo.org but does not mirror third-party actions. We use
      # the same shell install on GitHub so both workflows stay identical
      # (per the lock-step rule in the file header).
      # v2.12.2 was the first release built with go1.26, required after
      # the floor bump (code.gitea.io/sdk/gitea v0.24.1 needs go1.26).
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: golangci-lint
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          make lint

      # govulncheck flags known CVEs in transitive deps that touch
      # reachable code paths. Mirrors the Forgejo CI step. (#140
      # part 3.)
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          govulncheck ./...

      - name: go test (with coverage)
        run: go test ./... -race -count=1 -covermode=atomic -coverprofile=coverage.out

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      # Post the coverage summary as a PR comment so reviewers see drift
      # without clicking into the CI run. Uses a marker so re-runs update
      # the same comment instead of stacking. Mirrors the Forgejo step;
      # GitHub's API lives on api.github.com (instead of the
      # `${server_url}/api/v1` Forgejo path), but the issues/comments
      # shape is identical.
      - name: Post coverage to PR
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_BASE: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          MARKER='<!-- gaia-coverage-comment -->'
          summary=$(go tool cover -func=coverage.out | tail -30)
          {
            printf '%s\n' "$MARKER"
            printf '## Coverage summary\n\n'
            printf '```\n%s\n```\n\n' "$summary"
            printf '_Auto-posted by CI; updated on every push to this branch._\n'
          } > comment-body.md

          payload=$(jq -Rs '{body: .}' < comment-body.md)

          existing_id=""
          page=1
          while :; do
            chunk=$(curl -fsS \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_BASE}/repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=50&page=${page}")
            count=$(printf '%s' "$chunk" | jq 'length')
            if [ "$count" -eq 0 ]; then break; fi
            match=$(printf '%s' "$chunk" | jq -r --arg m "$MARKER" \
              'map(select(.body | startswith($m))) | .[0].id // empty')
            if [ -n "$match" ]; then existing_id="$match"; break; fi
            if [ "$count" -lt 50 ]; then break; fi
            page=$((page + 1))
          done

          if [ -n "$existing_id" ]; then
            echo "Updating existing coverage comment id=${existing_id}"
            curl -fsS -X PATCH \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "${API_BASE}/repos/${REPO}/issues/comments/${existing_id}" \
              > /dev/null
          else
            echo "Creating new coverage comment on PR #${PR_NUMBER}"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "${API_BASE}/repos/${REPO}/issues/${PR_NUMBER}/comments" \
              > /dev/null
          fi

      - name: go build
        run: make build
