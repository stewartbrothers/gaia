# Mirror of .forgejo/workflows/ci.yml for the eventual GitHub mirror (#47).
# Keep these two files in lock-step — the GitHub mirror is a publishing
# target, not a separate test surface.

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: gofmt check
        run: |
          set -e
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite the following files — run \`make fmt\`:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: go vet
        run: make vet

      # The Forgejo runner mirrors the actions/* namespace from
      # code.forgejo.org but does not mirror third-party actions. We use
      # the same shell install on GitHub so both workflows stay identical
      # (per the lock-step rule in the file header).
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: golangci-lint
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          make lint

      - name: go test (with coverage)
        run: go test ./... -race -count=1 -covermode=atomic -coverprofile=coverage.out

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: go build
        run: make build
