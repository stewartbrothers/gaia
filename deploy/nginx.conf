# nginx config for terminating TLS in front of gaia-mcp.
#
# Pairs with deploy/docker-compose.example.yml's "Pattern 2 —
# public via reverse proxy". Goals:
#
#   - terminate TLS on :443 with a real cert
#   - strip client-supplied X-Forwarded-For (audit-log integrity:
#     gaia-mcp uses the leftmost XFF element to attribute the call;
#     letting a client set it lets them spoof their IP)
#   - pass Authorization: Bearer through verbatim (the bearer is
#     the user's forge PAT — pass-through, no nginx-side validation)
#   - sensible timeouts that don't fight gaia-mcp's idle-timeout
#
# Drop into ./nginx.conf next to docker-compose.example.yml.

worker_processes  auto;
events { worker_connections 1024; }

http {
    sendfile        on;
    keepalive_timeout 75s;

    # Real client IP comes from the immediate proxy peer (this nginx
    # is the first hop the client touches). Don't trust XFF coming
    # IN — overwrite it with just the client's address.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive off;

    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"client":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time"'
    '}';
    access_log /var/log/nginx/access.log json;

    server {
        listen 443 ssl http2;
        server_name gaia-mcp.example.com;

        ssl_certificate     /etc/letsencrypt/live/gaia-mcp.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaia-mcp.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # MCP path: forward to gaia-mcp. Authorization passes
        # through verbatim — nginx does not inspect or modify it.
        location /mcp {
            # Replace any client-supplied XFF with just the client's
            # IP. Defense against a client spoofing their address.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;

            # Streamable HTTP needs HTTP/1.1 with proper
            # connection / upgrade headers if the client requests
            # SSE.
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Keep responses streaming (don't buffer SSE).
            proxy_buffering off;

            # Match gaia-mcp's idle-timeout (default 120s) so
            # nginx doesn't drop in-flight responses.
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;

            proxy_pass http://gaia-mcp.public:8080;
        }

        # Health probe — proxy to /healthz so external monitors
        # hitting https://gaia-mcp.example.com/healthz get a real
        # signal. /readyz works the same way.
        location ~ ^/(healthz|readyz)$ {
            proxy_set_header Host $host;
            proxy_pass http://gaia-mcp.public:8080;
        }

        # Everything else: 404. Don't expose nginx defaults.
        location / {
            return 404;
        }
    }

    # Optional: redirect plain HTTP to HTTPS. Enable if you bind
    # :80 too.
    # server {
    #     listen 80;
    #     server_name gaia-mcp.example.com;
    #     return 301 https://$host$request_uri;
    # }
}
