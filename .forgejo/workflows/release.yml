name: Release

# Triggers on tag push (v* convention). Tags created via:
#   git tag v0.1.0 && git push origin v0.1.0
#
# The workflow:
#   1. checkout + setup Go (mirrors the CI workflow)
#   2. shell-installs goreleaser (third-party actions don't mirror
#      to code.forgejo.org; install via go install pinned to a
#      specific version that matches local dev)
#   3. runs goreleaser with --skip=publish (we publish ourselves)
#   4. builds gaia (so we can dogfood it for the upload step)
#   5. runs `gaia release publish` to attach artifacts to the
#      Forgejo release (creates the release record if absent)
#
# A failure at any step leaves the tag pushed but with an empty
# (or partial) release; re-running the workflow re-attaches
# missing artifacts since `gaia release publish` is idempotent
# on the create step (uploads of existing assets currently 409 —
# tracked as a future improvement on #111).

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser's git-based changelog needs the full history
          # to walk commits since the previous tag.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      # Pinned to a specific version for reproducible builds. Bump
      # both this and the local-dev `go install` command together.
      - name: Install goreleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.4.5

      - name: Run goreleaser
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          goreleaser release --clean --skip=publish

      # Build gaia from this tag's source so the upload step uses
      # the same gaia behavior the release ships.
      - name: Build gaia
        run: make build

      - name: Publish release via gaia
        env:
          # FORGEJO_RELEASE_TOKEN is a repo-scoped token with
          # `write:repository`. Add it via Repository Settings →
          # Secrets. gaia honors GITEA_TOKEN as the env-var
          # convention for Forgejo (FORGEJO_TOKEN also works).
          GITEA_TOKEN: ${{ secrets.FORGEJO_RELEASE_TOKEN }}
        run: |
          ./bin/gaia release publish "${{ github.ref_name }}" \
            --asset 'dist/*.tar.gz' \
            --asset 'dist/*.zip' \
            --asset 'dist/*checksums.txt' \
            --notes-from CHANGELOG.md
