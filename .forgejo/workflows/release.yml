name: Release

# Triggers on tag push (v* convention). Tags created via:
#   git tag v0.1.0 && git push origin v0.1.0
#
# The workflow:
#   1. checkout + setup Go (mirrors the CI workflow)
#   2. shell-installs goreleaser (third-party actions don't mirror
#      to code.forgejo.org; install via go install pinned to a
#      specific version that matches local dev)
#   3. runs goreleaser with --skip=publish (we publish ourselves)
#   4. attaches dist/* to the tag's Forgejo release via the gitea
#      API
#
# A failure at any step leaves the tag pushed but with an empty
# release; re-running the workflow (or running goreleaser locally
# and uploading via the gitea API) re-attaches the artifacts.
#
# IMPORTANT: Forgejo does NOT auto-create a release record on tag
# push (unlike GitHub, which does). The upload step below creates
# the release if it doesn't exist, then attaches assets to it.
# Idempotent — re-runs against an existing release just attach the
# assets without recreating.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser's git-based changelog needs the full history
          # to walk commits since the previous tag.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      # Pinned to a specific version so reproducible builds: bump
      # both this and the local-dev `go install` command at the
      # same time.
      - name: Install goreleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.4.5

      - name: Run goreleaser
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          goreleaser release --clean --skip=publish

      - name: Upload artifacts to Forgejo release
        env:
          # FORGEJO_RELEASE_TOKEN is a repo-scoped token with the
          # `write:repository` scope. Add it via the Forgejo UI:
          # Repository Settings → Secrets → Add Secret. The CI runner
          # exports it automatically as $FORGEJO_RELEASE_TOKEN.
          FORGEJO_RELEASE_TOKEN: ${{ secrets.FORGEJO_RELEASE_TOKEN }}
          # The forge passes the tag name through GITHUB_REF on tag
          # pushes (Forgejo Actions mirrors the GitHub variable
          # naming for compatibility).
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          API_BASE: ${{ github.server_url }}/api/v1
        run: |
          set -euo pipefail

          # Resolve or create the release record. Forgejo doesn't
          # auto-create on tag push, so the GET-then-POST dance is
          # required for every fresh tag.
          release_id=$(curl -sS \
            -H "Authorization: token ${FORGEJO_RELEASE_TOKEN}" \
            "${API_BASE}/repos/${REPO}/releases/tags/${TAG}" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("id",""))')

          if [ -z "${release_id}" ]; then
            echo "No release for ${TAG} yet; creating one."
            # Body: pull the matching CHANGELOG section
            # (## [TAG_NUMERIC] up to but not including the next ## [).
            tag_numeric="${TAG#v}"
            release_body=$(awk -v t="${tag_numeric}" '
              $0 ~ "^## \\[" t "\\]" { p=1 }
              p && /^## \[/ && $0 !~ "^## \\[" t "\\]" { exit }
              p { print }
            ' CHANGELOG.md || true)

            release_id=$(python3 -c "
          import json, os, urllib.request
          payload = json.dumps({
            'tag_name': os.environ['TAG'],
            'name': os.environ['TAG'],
            'body': os.environ.get('RELEASE_BODY', ''),
            'draft': False,
            'prerelease': False,
          }).encode()
          req = urllib.request.Request(
            f\"{os.environ['API_BASE']}/repos/{os.environ['REPO']}/releases\",
            data=payload,
            headers={
              'Authorization': f\"token {os.environ['FORGEJO_RELEASE_TOKEN']}\",
              'Content-Type': 'application/json',
            },
            method='POST',
          )
          with urllib.request.urlopen(req) as r:
            print(json.loads(r.read())['id'])
          " RELEASE_BODY="${release_body}")
            echo "Created release id=${release_id}"
          else
            echo "Release id=${release_id} already exists for ${TAG}; uploading to it."
          fi

          for f in dist/*.tar.gz dist/*.zip dist/*checksums.txt; do
            [ -f "$f" ] || continue
            echo "Uploading $(basename "$f")"
            curl -fsSL \
              -H "Authorization: token ${FORGEJO_RELEASE_TOKEN}" \
              -X POST \
              -F "attachment=@${f}" \
              "${API_BASE}/repos/${REPO}/releases/${release_id}/assets?name=$(basename "$f")"
            echo
          done

          echo "✓ Upload complete"
