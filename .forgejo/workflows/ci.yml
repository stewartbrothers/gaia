name: CI

# CI actions are pinned by commit SHA (not floating tag) so a
# compromised actions/* org can't push a malicious update under
# a tag we already trust. Bump the SHA and the trailing version
# comment together when updating; the version comment is the
# source of truth for what version the SHA represents — auditors
# read the comment, not the API. (#140 part 2.)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          # Pinned to match the floor in go.mod. mcp-go v0.50.x
          # (#138) bumped its own toolchain requirement to 1.25.5,
          # so gaia's floor moved with it. Bump go.mod and this
          # file together.
          go-version: '1.25'
          cache: true

      - name: gofmt check
        run: |
          set -e
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite the following files — run \`make fmt\`:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: go vet
        run: make vet

      # The Forgejo runner mirrors the actions/* namespace from
      # code.forgejo.org but does not mirror third-party actions, so we
      # install golangci-lint via `go install` rather than the official
      # action. Keep version in lock-step with .golangci.yml comment.
      # v2 line — required for Go 1.25 toolchain support; v1.64.x
      # was built against go1.23 and refuses to load configs that
      # target newer toolchains.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.1

      - name: golangci-lint
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          make lint

      # govulncheck flags known CVEs in transitive deps that touch
      # reachable code paths. Cheap (runs in seconds), and it
      # closes the same risk class that the mcp-go staleness in
      # #138 represented — by surfacing it on every PR rather than
      # waiting for an ad-hoc audit. Same install pattern as
      # golangci-lint above (Forgejo runner doesn't mirror
      # third-party actions). Pinned to @latest because govulncheck
      # is itself short-lived per release and only the CVE
      # database it queries is the security-relevant input. (#140
      # part 3.)
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          govulncheck ./...

      - name: go test (with coverage)
        run: go test ./... -race -count=1 -covermode=atomic -coverprofile=coverage.out

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      # Post the coverage summary as a PR comment so reviewers see drift
      # without clicking into the CI run. Uses a marker so re-runs update
      # the same comment instead of stacking. Forgejo Actions auto-injects
      # `GITHUB_TOKEN` scoped to this repo (same env-var name as GitHub
      # Actions). Skipped on push events because there is no PR to comment
      # on. No third-party action — Forgejo runner does not mirror them.
      - name: Post coverage to PR
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_BASE: ${{ github.server_url }}/api/v1
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          MARKER='<!-- gaia-coverage-comment -->'
          summary=$(go tool cover -func=coverage.out | tail -30)
          {
            printf '%s\n' "$MARKER"
            printf '## Coverage summary\n\n'
            printf '```\n%s\n```\n\n' "$summary"
            printf '_Auto-posted by CI; updated on every push to this branch._\n'
          } > comment-body.md

          # jq -Rs reads the whole file as a JSON string (escaping newlines
          # / quotes / backticks correctly); building the JSON envelope
          # with --arg keeps shell quoting out of the picture.
          payload=$(jq -Rs '{body: .}' < comment-body.md)

          # Find an existing marker-tagged comment (paginate; PR comment
          # threads can exceed the default 50-per-page limit on busy PRs).
          existing_id=""
          page=1
          while :; do
            chunk=$(curl -fsS \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Accept: application/json" \
              "${API_BASE}/repos/${REPO}/issues/${PR_NUMBER}/comments?page=${page}&limit=50")
            count=$(printf '%s' "$chunk" | jq 'length')
            if [ "$count" -eq 0 ]; then break; fi
            match=$(printf '%s' "$chunk" | jq -r --arg m "$MARKER" \
              'map(select(.body | startswith($m))) | .[0].id // empty')
            if [ -n "$match" ]; then existing_id="$match"; break; fi
            if [ "$count" -lt 50 ]; then break; fi
            page=$((page + 1))
          done

          if [ -n "$existing_id" ]; then
            echo "Updating existing coverage comment id=${existing_id}"
            curl -fsS -X PATCH \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "${API_BASE}/repos/${REPO}/issues/comments/${existing_id}" \
              > /dev/null
          else
            echo "Creating new coverage comment on PR #${PR_NUMBER}"
            curl -fsS -X POST \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "${API_BASE}/repos/${REPO}/issues/${PR_NUMBER}/comments" \
              > /dev/null
          fi

      - name: go build
        run: make build
